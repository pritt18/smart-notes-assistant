<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Notes Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <div>
          <h1>Smart Notes Assistant</h1>
          <p class="subtitle">AI-Powered Note Categorization & Semantic Search</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-load-starter" class="btn btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Load Starter Notes
        </button>
      </div>
    </header>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden"></div>

    <main class="main-content">
      <!-- Left Column: Input and Search -->
      <section class="action-column">
        <!-- Add Note Card -->
        <div class="card">
          <div class="card-header">
            <h2>Add New Note</h2>
            <span class="badge badge-info">Auto-Classify</span>
          </div>
          <form id="note-form">
            <div class="form-group">
              <label for="note-text">Note Text</label>
              <textarea 
                id="note-text" 
                rows="4" 
                placeholder="e.g., Revise statistics chapters before Wednesday's test, or Pay electricity bill before the 28th..." 
                maxlength="1000" 
                required
              ></textarea>
              <div class="char-counter"><span id="char-count">0</span> / 1000</div>
            </div>
            <div class="form-footer">
              <button type="submit" id="btn-save-note" class="btn btn-primary">
                Save & Classify
              </button>
            </div>
          </form>
        </div>

        <!-- Semantic Search Card -->
        <div class="card">
          <div class="card-header">
            <h2>Search Notes</h2>
            <span class="badge badge-secondary">Hybrid TF-IDF</span>
          </div>
          <div class="search-box">
            <div class="search-input-wrapper">
              <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input 
                type="text" 
                id="search-input" 
                placeholder="Search by keywords or phrase (e.g. flight, hotel, money transfer)..."
              >
              <button id="btn-clear-search" class="clear-btn hidden">&times;</button>
            </div>
            <button id="btn-search" class="btn btn-primary">Search</button>
          </div>

          <!-- Search Results Area -->
          <div id="search-results-section" class="search-results-section hidden">
            <div class="results-header">
              <h3>Search Results (<span id="search-count">0</span>)</h3>
              <button id="btn-close-search" class="text-btn">Reset</button>
            </div>
            <div id="search-results-list" class="notes-list"></div>
          </div>
        </div>
      </section>

      <!-- Right Column: Saved Notes Library -->
      <section class="library-column">
        <div class="card full-height">
          <div class="card-header flex-between">
            <div>
              <h2>Saved Notes</h2>
              <p class="section-desc">Persistent local SQLite storage</p>
            </div>
            <span class="count-pill" id="total-notes-pill">0 notes</span>
          </div>

          <!-- Category Filters -->
          <div class="filter-bar">
            <button class="filter-tab active" data-category="all">All</button>
            <button class="filter-tab" data-category="Study">Study</button>
            <button class="filter-tab" data-category="Money">Money</button>
            <button class="filter-tab" data-category="Travel">Travel</button>
            <button class="filter-tab" data-category="Shopping">Shopping</button>
            <button class="filter-tab filter-uncertain" data-uncertain="true">⚠️ Uncertain</button>
          </div>

          <!-- Notes List Container -->
          <div id="notes-container" class="notes-list">
            <div class="empty-state">Loading notes...</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
